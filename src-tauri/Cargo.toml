[package]
name = "kaizen-study"
version = "0.1.0"
description = "Kaizen Study - organizador de sesiones de estudio"
authors = ["Andrew Gerard"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kaizen_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
window-vibrancy = "0.8.1"
spellbook = "0.4.2"
tauri-plugin-autostart = "2.7.0"
keyring = "4.2.0"
ureq = { version = "3.5.0", features = ["json"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
tauri-plugin-opener = "2.7.2"
cpal = "0.18.2"
whisper-rs = "0.16.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
